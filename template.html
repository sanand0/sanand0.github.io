<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anand's Code</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PGNpcmNsZSBjeD0iMTYiIGN5PSIxNiIgcj0iMTUiIGZpbGw9IiMyNTYzZWIiLz48cGF0aCBmaWxsPSIjZmZmIiBkPSJtMTYgNyAyIDcgNyAyLTcgMi0yIDctMi03LTctMiA3LTJaIi8+PC9zdmc+" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
      /* ── Tokens ── */
      :root {
        --brand: #6366f1;
        --violet: #8b5cf6;
        --rose: #c084fc;
        --star: #f59e0b;
        --green: #10b981;
        --radius: 12px;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.07), 0 1px 2px rgba(0,0,0,.04);
        --shadow-md: 0 8px 28px rgba(0,0,0,.12), 0 2px 8px rgba(0,0,0,.06);
        --shadow-brand: 0 2px 12px rgba(99,102,241,.35);
        --t: .2s ease;
        --navbar-h: 56px;
        /* body-bg-rgb must match Bootstrap's actual body bg for each theme */
        --body-bg-rgb: 255,255,255;
      }
      [data-bs-theme="dark"] { --body-bg-rgb: 33,37,41; }

      /* ── Base ── */
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }

      /* Dot-grid overlay (fixed so it doesn't scroll with content) */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: radial-gradient(circle, rgba(99,102,241,.055) 1px, transparent 1px);
        background-size: 28px 28px;
        pointer-events: none;
        z-index: -1;
      }

      /* ── Navbar ── */
      .app-nav {
        background: #0f172a !important;
        border-bottom: 1px solid rgba(255,255,255,.07);
        position: sticky;
        top: 0;
        z-index: 300;
      }
      .navbar-brand {
        font-weight: 700;
        font-size: 1.05rem;
        letter-spacing: -.015em;
        background: linear-gradient(130deg, #a5b4fc, #c7d2fe);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        display: flex;
        align-items: center;
        gap: .5rem;
      }
      .theme-btn {
        border-radius: 999px !important;
        font-size: .8125rem;
        padding: .25rem .85rem !important;
      }

      /* ── Hero ── */
      .hero {
        background: linear-gradient(135deg, #1e1b4b 0%, #312e81 38%, #5b21b6 72%, #6d28d9 100%);
        padding: 3.25rem 0 3rem;
        position: relative;
        overflow: hidden;
      }
      /* Animated soft-light orbs */
      .hero::before, .hero::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
      }
      .hero::before {
        width: 520px; height: 520px;
        background: radial-gradient(circle, rgba(129,140,248,.55) 0%, transparent 70%);
        top: -200px; right: -80px;
        filter: blur(60px);
        animation: orb-drift 14s ease-in-out infinite;
      }
      .hero::after {
        width: 380px; height: 380px;
        background: radial-gradient(circle, rgba(192,132,252,.45) 0%, transparent 70%);
        bottom: -120px; left: 6%;
        filter: blur(50px);
        animation: orb-drift 18s ease-in-out infinite reverse;
      }
      @keyframes orb-drift {
        0%,100% { transform: translate(0,0) scale(1); }
        33%      { transform: translate(25px,-18px) scale(1.05); }
        66%      { transform: translate(-18px,12px) scale(.97); }
      }
      .hero-inner { position: relative; z-index: 1; }

      .hero-eyebrow {
        font-size: .72rem;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: rgba(255,255,255,.45);
        margin-bottom: .75rem;
      }
      .hero-title {
        font-size: clamp(2rem, 5vw, 3.25rem);
        font-weight: 800;
        color: #fff;
        letter-spacing: -.04em;
        line-height: 1.05;
        margin: 0;
      }
      .hero-title .gradient-text {
        background: linear-gradient(90deg, #a5b4fc, #c084fc, #f9a8d4);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .hero-sub {
        color: rgba(255,255,255,.5);
        font-size: .9375rem;
        margin-top: .75rem;
        line-height: 1.65;
      }
      .hero-stats {
        display: flex;
        align-items: center;
        gap: 0;
        flex-wrap: wrap;
      }
      .hero-stat {
        padding: 0 2rem;
        text-align: center;
      }
      .hero-stat:first-child { padding-left: 0; }
      .hero-stat-sep {
        width: 1px;
        height: 3rem;
        background: rgba(255,255,255,.15);
        flex-shrink: 0;
      }
      .hero-stat-val {
        font-size: 2.5rem;
        font-weight: 800;
        color: #fff;
        letter-spacing: -.05em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .hero-stat-lbl {
        font-size: .68rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: .1em;
        color: rgba(255,255,255,.4);
        margin-top: .25rem;
      }

      /* ── Stats row ── */
      .stats-row {
        padding: .65rem 0 .3rem;
        font-size: .875rem;
        color: var(--bs-secondary-color);
      }
      #visible-count {
        font-weight: 700;
        color: var(--bs-body-color);
        font-variant-numeric: tabular-nums;
        display: inline-block;
        min-width: 2ch; /* prevent layout shift when count changes */
        text-align: right;
      }
      .total-stars { font-weight: 600; color: var(--star); }
      .clear-btn {
        border: 1.5px solid var(--bs-border-color) !important;
        border-radius: 999px !important;
        font-size: .8rem;
        display: inline-flex;
        align-items: center;
        gap: .25rem;
        background: transparent;
        color: var(--bs-body-color);
        transition: border-color var(--t), color var(--t);
      }
      .clear-btn:hover { border-color: var(--brand) !important; color: var(--brand) !important; }

      /* ── Filter bar ── */
      .filter-bar {
        position: sticky;
        top: var(--navbar-h);
        z-index: 200;
        background: var(--bs-body-bg);
        border-bottom: 1px solid var(--bs-border-color);
        padding: .6rem 0;
        transition: box-shadow var(--t), background var(--t);
      }
      .filter-bar.shadowed {
        background: rgba(var(--body-bg-rgb), .88);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 4px 24px rgba(0,0,0,.1);
      }

      /* Search */
      .search-wrap { position: relative; }
      .search-wrap .bi-search {
        position: absolute; left: .7rem; top: 50%;
        transform: translateY(-50%);
        color: var(--bs-secondary-color);
        font-size: .8rem;
        pointer-events: none;
        transition: color var(--t);
      }
      .search-wrap:focus-within .bi-search { color: var(--brand); }
      .search-input {
        padding-left: 2rem !important;
        border-radius: 999px !important;
        border: 1.5px solid var(--bs-border-color) !important;
        background: var(--bs-body-bg) !important;
        color: var(--bs-body-color) !important;
        font-size: .8125rem;
        height: 34px;
        transition: border-color var(--t), box-shadow var(--t);
      }
      .search-input:focus {
        border-color: var(--brand) !important;
        box-shadow: 0 0 0 3px rgba(99,102,241,.18) !important;
        outline: none;
      }

      /* Pill selects */
      .pill-select {
        border-radius: 999px;
        border: 1.5px solid var(--bs-border-color);
        background: var(--bs-body-bg);
        color: var(--bs-body-color);
        font-size: .8125rem;
        padding: .2rem .75rem;
        height: 34px;
        cursor: pointer;
        appearance: auto;
        transition: border-color var(--t), color var(--t), box-shadow var(--t);
        white-space: nowrap;
      }
      .pill-select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
      .pill-select.is-active { border-color: var(--brand); color: var(--brand); }

      /* Chips */
      .chip-row {
        display: flex; gap: .35rem;
        overflow-x: auto; scrollbar-width: none;
        padding: .25rem 0 .15rem;
        -webkit-overflow-scrolling: touch;
      }
      .chip-row::-webkit-scrollbar { display: none; }
      .chip {
        flex-shrink: 0; display: inline-flex; align-items: center; gap: .25rem;
        padding: .2rem .65rem;
        border-radius: 999px;
        border: 1.5px solid var(--bs-border-color);
        background: transparent;
        color: var(--bs-secondary-color);
        font-size: .775rem; font-weight: 500;
        cursor: pointer;
        transition: all var(--t);
        line-height: 1.6; white-space: nowrap;
      }
      .chip:hover {
        border-color: var(--brand); color: var(--brand);
        background: rgba(99,102,241,.07);
        transform: translateY(-1px);
      }
      .chip.is-active {
        background: hsl(var(--hue,240), 65%, 50%);
        border-color: hsl(var(--hue,240), 65%, 50%);
        color: #fff;
        box-shadow: 0 0 0 3px hsl(var(--hue,240), 65%, 82%), 0 2px 10px hsl(var(--hue,240), 65%, 60%);
        transform: translateY(-1px);
      }
      .chip .chip-count {
        font-size: .68rem; padding: .1em .42em;
        border-radius: 999px;
        background: rgba(255,255,255,.22); line-height: 1.5;
      }
      .chip:not(.is-active) .chip-count { background: rgba(99,102,241,.12); color: var(--brand); }

      /* ── Card grid ── */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 1rem;
        padding: 1rem 0;
      }
      .repo-card[hidden] { display: none !important; }

      .repo-card .card {
        border-radius: var(--radius) !important;
        border: 1.5px solid var(--bs-border-color) !important;
        box-shadow: var(--shadow-sm);
        background: var(--bs-body-bg);
        transition: box-shadow var(--t), border-color var(--t), transform var(--t);
        height: 100%; overflow: hidden; position: relative;
      }

      /* Gradient accent stripe — topic-colored, always visible, brighter on hover */
      .repo-card .card::before {
        content: '';
        position: absolute; top: 0; left: 0; right: 0; height: 3px;
        background: linear-gradient(90deg,
          hsl(var(--hue,240), 70%, 58%),
          hsl(calc(var(--hue,240) + 30), 75%, 65%));
        opacity: .35;
        transition: opacity var(--t);
        z-index: 1;
      }
      .repo-card .card:hover::before { opacity: 1; }

      .repo-card .card:hover {
        box-shadow: var(--shadow-md), 0 0 0 1px hsl(var(--hue,240), 60%, 88%);
        border-color: hsl(var(--hue,240), 60%, 60%) !important;
        transform: translateY(-3px);
      }
      [data-bs-theme="dark"] .repo-card .card:hover {
        box-shadow: var(--shadow-md), 0 0 0 1px hsl(var(--hue,240), 45%, 35%);
        border-color: hsl(var(--hue,240), 50%, 55%) !important;
      }

      /* "Hot" repos (≥50 stars): always-bright gold accent */
      .repo-card[data-hot] .card::before {
        background: linear-gradient(90deg, #f59e0b, #fbbf24, #f97316);
        opacity: .7;
      }
      .repo-card[data-hot] .card:hover::before { opacity: 1; }
      .repo-card[data-hot] .card:hover {
        border-color: #d97706 !important;
        box-shadow: var(--shadow-md), 0 0 0 1px rgba(245,158,11,.25) !important;
      }

      /* Icon wrapper — topic-hue colored background */
      .icon-wrap {
        width: 40px; height: 40px;
        border-radius: 11px;
        background: hsl(var(--hue,240), 72%, 93%);
        color: hsl(var(--hue,240), 55%, 42%);
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0;
        transition: background var(--t), color var(--t);
      }
      [data-bs-theme="dark"] .icon-wrap {
        background: hsl(var(--hue,240), 45%, 22%);
        color: hsl(var(--hue,240), 70%, 72%);
      }
      .repo-card .card:hover .icon-wrap {
        background: hsl(var(--hue,240), 72%, 87%);
      }
      [data-bs-theme="dark"] .repo-card .card:hover .icon-wrap {
        background: hsl(var(--hue,240), 45%, 28%);
      }
      .repo-icon { width: 22px; height: 22px; object-fit: contain; }
      .icon-placeholder { font-size: 1rem; opacity: .75; }

      /* Card text */
      .card-name {
        font-size: 1rem; font-weight: 700;
        color: var(--bs-body-color);
        text-decoration: none;
        letter-spacing: -.018em; line-height: 1.25;
        transition: color var(--t); display: inline;
      }
      .card-name:hover { color: hsl(var(--hue,240), 60%, 45%); }
      [data-bs-theme="dark"] .card-name:hover { color: hsl(var(--hue,240), 70%, 72%); }
      .card-desc {
        font-size: .8125rem; color: var(--bs-secondary-color);
        line-height: 1.55; margin-top: .3rem;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
      }

      /* "Recent" badge */
      .recent-badge {
        display: inline-flex; align-items: center; gap: .25rem;
        font-size: .6rem; font-weight: 700;
        text-transform: uppercase; letter-spacing: .06em;
        padding: .15rem .45rem;
        border-radius: 999px;
        background: rgba(16,185,129,.12);
        color: #059669;
        border: 1px solid rgba(16,185,129,.25);
        vertical-align: middle; line-height: 1.6;
        flex-shrink: 0;
      }
      [data-bs-theme="dark"] .recent-badge { background: rgba(16,185,129,.18); color: #34d399; border-color: rgba(52,211,153,.25); }
      .recent-dot {
        width: 5px; height: 5px; border-radius: 50%;
        background: currentColor; flex-shrink: 0;
        animation: pulse-dot 2.2s ease-in-out infinite;
      }
      @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:.25} }

      /* Topic pills — topic-hue colored per pill */
      .topic-pill {
        display: inline-flex; align-items: center;
        font-size: .6875rem; font-weight: 600;
        padding: .18rem .55rem;
        border-radius: 999px; border: none;
        background: hsl(var(--hue,240), 68%, 92%);
        color: hsl(var(--hue,240), 55%, 38%);
        cursor: pointer; line-height: 1.6;
        transition: background var(--t), color var(--t), transform var(--t);
        white-space: nowrap;
      }
      .topic-pill:hover {
        background: hsl(var(--hue,240), 65%, 48%);
        color: #fff; transform: scale(1.06);
      }
      [data-bs-theme="dark"] .topic-pill {
        background: hsl(var(--hue,240), 42%, 22%);
        color: hsl(var(--hue,240), 70%, 72%);
      }
      [data-bs-theme="dark"] .topic-pill:hover {
        background: hsl(var(--hue,240), 60%, 55%);
        color: #fff;
      }

      /* Star count — amber pill badge */
      .star-count {
        font-size: .78rem; font-weight: 700; color: #92400e;
        background: rgba(245,158,11,.15);
        border-radius: 999px;
        padding: .15rem .5rem;
        text-decoration: none; white-space: nowrap;
        display: inline-flex; align-items: center; gap: .25rem;
        transition: background var(--t), color var(--t);
      }
      .star-count:hover { background: rgba(245,158,11,.28); color: #78350f; }
      [data-bs-theme="dark"] .star-count { color: #fcd34d; background: rgba(245,158,11,.18); }
      [data-bs-theme="dark"] .star-count:hover { background: rgba(245,158,11,.3); }

      /* Card footer */
      .card-footer {
        background: transparent !important;
        border-top: 1px solid var(--bs-border-color) !important;
        padding: .45rem .85rem;
        font-size: .73rem; color: var(--bs-secondary-color);
      }
      .card-footer a { color: var(--bs-secondary-color); text-decoration: none; transition: color var(--t); }
      .card-footer a:hover { color: var(--brand); }

      /* ── Empty state ── */
      #empty-state { text-align: center; padding: 5rem 2rem; color: var(--bs-secondary-color); }
      #empty-state .bi { font-size: 2.5rem; opacity: .18; display: block; }

      /* ── Page fade-in ── */
      @keyframes fade-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
      #card-grid { animation: fade-in .4s ease both; }

      /* ── Responsive ── */
      @media (max-width: 768px) {
        .hero-stats { gap: 0; }
        .hero-stat { padding: 0 1.25rem; }
        .hero-stat-val { font-size: 2rem; }
      }
      @media (max-width: 576px) {
        .filter-controls { flex-wrap: wrap; }
        .search-wrap { flex: 1 1 100% !important; }
        .hero-stat { padding: 0 1rem; }
      }
    </style>
  </head>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/@gramex/ui@0.3/dist/dark-theme.js" type="module"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        // Glassmorphism on filter bar when it sticks
        const filterBar = document.querySelector(".filter-bar");
        if (filterBar) {
          const sentinel = document.createElement("div");
          filterBar.before(sentinel);
          new IntersectionObserver(([e]) => filterBar.classList.toggle("shadowed", !e.isIntersecting)).observe(sentinel);
        }

        // Cache card data once
        const cards = [...document.querySelectorAll(".repo-card")].map((el) => ({
          el,
          topics: JSON.parse(el.dataset.topics),
          updated: el.dataset.updated,
          created: el.dataset.created,
          name: el.dataset.name,
          desc: el.dataset.desc,
          stars: +el.dataset.stars,
        }));

        const state = { search: "", topics: new Set(), updated: "all", created: "all", sort: "updated" };

        const withinTime = (dateStr, filter) => {
          if (filter === "all") return true;
          const d = new Date(dateStr), now = new Date();
          if (filter === "week") return d > new Date(+now - 7 * 864e5);
          if (filter === "month") { const c = new Date(now); c.setMonth(c.getMonth() - 1); return d > c; }
          return new Date(dateStr).getFullYear() === +filter;
        };

        const matches = (c, skip = null) => {
          if (skip !== "search" && state.search && !c.name.includes(state.search) && !c.desc.includes(state.search)) return false;
          if (skip !== "topics" && state.topics.size && !c.topics.some((t) => state.topics.has(t))) return false;
          if (skip !== "updated" && !withinTime(c.updated, state.updated)) return false;
          if (skip !== "created" && !withinTime(c.created, state.created)) return false;
          return true;
        };

        const grid = document.getElementById("card-grid");
        const visibleCountEl = document.getElementById("visible-count");
        const emptyState = document.getElementById("empty-state");
        const clearBtn = document.getElementById("clear-filters");
        const updatedSel = document.getElementById("updated-select");
        const createdSel = document.getElementById("created-select");
        const chipRow = document.getElementById("chip-row");

        // Animated counter (ease-out cubic, cancels in-flight animation)
        let countRaf;
        const animateCount = (el, to) => {
          cancelAnimationFrame(countRaf);
          const from = parseInt(el.textContent) || 0;
          if (from === to) return;
          const dur = Math.min(280, Math.abs(to - from) * 6);
          const t0 = performance.now();
          const tick = (now) => {
            const p = Math.min((now - t0) / dur, 1);
            el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
            if (p < 1) countRaf = requestAnimationFrame(tick);
          };
          countRaf = requestAnimationFrame(tick);
        };

        const setChipActive = (chip, active) => {
          chip.classList.toggle("is-active", active);
          chip.setAttribute("aria-pressed", String(active));
        };

        const update = () => {
          const sorters = {
            stars:   (a, b) => b.stars - a.stars,
            updated: (a, b) => new Date(b.updated) - new Date(a.updated),
            created: (a, b) => new Date(b.created) - new Date(a.created),
            name:    (a, b) => a.name.localeCompare(b.name),
          };
          const sorted = [...cards].sort(sorters[state.sort] || sorters.updated);

          let visible = 0;
          sorted.forEach((c) => {
            const show = matches(c);
            c.el.hidden = !show;
            if (show) visible++;
            grid.appendChild(c.el);
          });

          animateCount(visibleCountEl, visible);
          emptyState.style.display = visible ? "none" : "";

          chipRow.querySelectorAll(".chip").forEach((chip) => {
            const topic = chip.dataset.topic;
            const count = cards.filter((c) =>
              matches(c, "topics") && (topic === "" || c.topics.includes(topic))
            ).length;
            const badge = chip.querySelector(".chip-count");
            badge.textContent = count;
            badge.hidden = count === 0 && topic !== "";
          });

          updatedSel.classList.toggle("is-active", state.updated !== "all");
          createdSel.classList.toggle("is-active", state.created !== "all");
          const hasFilters = state.search || state.topics.size || state.updated !== "all" || state.created !== "all";
          clearBtn.style.display = hasFilters ? "" : "none";
        };

        document.getElementById("search-input").addEventListener("input", (e) => {
          state.search = e.target.value.toLowerCase().trim();
          update();
        });
        document.getElementById("sort-select").addEventListener("change", (e) => {
          state.sort = e.target.value; update();
        });
        updatedSel.addEventListener("change", (e) => { state.updated = e.target.value; update(); });
        createdSel.addEventListener("change", (e) => { state.created = e.target.value; update(); });

        chipRow.addEventListener("click", (e) => {
          const chip = e.target.closest(".chip");
          if (!chip) return;
          const topic = chip.dataset.topic;
          const allChip = chipRow.querySelector('.chip[data-topic=""]');
          if (topic === "") {
            state.topics.clear();
            chipRow.querySelectorAll(".chip").forEach((c) => setChipActive(c, false));
            setChipActive(allChip, true);
          } else {
            setChipActive(allChip, false);
            const nowActive = !chip.classList.contains("is-active");
            setChipActive(chip, nowActive);
            state.topics[nowActive ? "add" : "delete"](topic);
            if (!state.topics.size) setChipActive(allChip, true);
          }
          update();
        });

        document.addEventListener("click", (e) => {
          const pill = e.target.closest(".topic-pill");
          if (!pill) return;
          e.stopPropagation();
          const topic = pill.dataset.topic;
          state.topics.clear();
          state.topics.add(topic);
          chipRow.querySelectorAll(".chip").forEach((c) => setChipActive(c, false));
          const target = chipRow.querySelector(`.chip[data-topic="${topic}"]`);
          if (target) setChipActive(target, true);
          update();
        });

        clearBtn.addEventListener("click", () => {
          state.search = ""; state.topics.clear(); state.updated = "all"; state.created = "all";
          document.getElementById("search-input").value = "";
          updatedSel.value = "all"; createdSel.value = "all";
          chipRow.querySelectorAll(".chip").forEach((c) => setChipActive(c, false));
          setChipActive(chipRow.querySelector('.chip[data-topic=""]'), true);
          update();
        });

        grid.addEventListener("animationend", () => { grid.style.animation = "none"; }, { once: true });
        update();
      });
    </script>
  </body>
</html>
